# Dependencias de EVALUON con versión fija (plan 001, "Estructura del código").
# Las versiones y el motivo de cada una están en specs/001-normativa/entorno.md (T-005).
# La imagen de la aplicación (Dockerfile) instala las dependencias y las de prueba:
# la suite corre dentro del contenedor con `docker compose run --rm app pytest`.
# Forma rápida (T-224): en paralelo, una base de pruebas por proceso (test_evaluon_gwN)
# en el mismo Postgres:
#   docker compose run --rm app pytest -n 8 --dist worksteal -q
# Medido en el equipo (24 CPUs, 20 GB para Docker): en serie 33-38 min; -n 8 con el
# reparto por omisión, unos 17 min (unas pocas pruebas de 50 a 90 s quedan al final en un
# solo proceso); -n 8 --dist worksteal, unos 9 min; -n 12, 8 min, con un 50 % más de memoria.
# Se eligió 8: la mitad de las CPUs y unos 6 GB, porque el equipo comparte la memoria con
# los modelos. En serie, omitir `-n` y `--dist`. Ninguna prueba necesita correr aparte.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluon"
version = "0.1.0"
description = "Normativa de compras consultable con cita, con IA local"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Aplicación web y base (ADR-0005)
    "Django==6.1.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "argon2-cffi==25.1.0",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    # Lectura de documentos (ADR-0004)
    "pdfplumber==0.11.10",
    "pypdfium2==5.13.0",
    "pytesseract==0.3.13",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    # Fotos de ofertas y su preparación para el OCR (ADR-0028, T-131); ya la trae la imagen
    "pillow==12.3.0",
    # PDF de la matriz generado en el equipo (ADR-0020, REQ-032)
    "weasyprint==70.0",
    # Casos de las evals en YAML (evals/casos/EV-NNN.yaml); la biblioteca estándar
    # no lee YAML. Los clientes HTTP de evaluon/ai/ usan urllib de la biblioteca
    # estándar, por eso no hay biblioteca de cliente HTTP.
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    # Suite en paralelo (T-224): pytest-xdist 3.8.0, licencia MIT, Python >=3.9; pytest-django
    # crea una base test_<db>_gwN por proceso. execnet es su dependencia.
    "pytest-xdist==3.8.0",
    "execnet==2.1.2",
]

[tool.setuptools]
# El código no se instala como paquete: corre desde /app dentro de la imagen.
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "evaluon.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "decision_literal: prueba de una decisión literal del responsable (004, ADR-0043)",
]
