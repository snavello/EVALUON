# Entorno de EVALUON (plan 001, "Servicios"; plan 003, "Componentes"): los seis servicios
# de la 001 más `generation_batch` y `worker` (ADR-0018).
# Los servicios de IA y la base están en una red interna sin salida a internet y sin
# puertos publicados. La única excepción es `portal_worker` (plan 012, ADR-0031), que
# además está en la red `egress` para leer el Portal de Compras. Los archivos de los modelos se bajan con scripts/fetch_models.sh.
# Las credenciales de la base se leen de .env (copiar .env.example y completar).

name: evaluon

# Configuración común de `migrate` y `app` (T-005): la misma imagen propia (Dockerfile),
# las mismas variables y el código montado en solo lectura, para que `docker compose run
# --rm app pytest` pruebe siempre el código de la copia de trabajo y no el que quedó en la
# imagen. Un cambio en pyproject.toml o en el Dockerfile sí necesita reconstruir la imagen
# (docker compose build app).
x-app: &app
  build: .
  image: evaluon-app:local
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-evaluon}
    POSTGRES_USER: ${POSTGRES_USER:-evaluon}
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (copiar .env.example a .env y completarla)}"
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # Servicios de IA (T-054). Las variables de modelo son las mismas que arman el
    # `command` de generation, embeddings y reranker, con el mismo valor por omisión: así
    # el servidor y la aplicación leen una sola fuente (.env) y el registro de cada
    # consulta nombra el modelo que respondió (P6). tests/test_compose_env.py comprueba
    # que coincidan; al cambiar un valor por omisión, cambiarlo en los dos lugares y en
    # evaluon/settings.py.
    GENERATION_URL: ${GENERATION_URL:-http://generation:8080}
    # Motor de los pedidos del `worker` y del comando de medición (ADR-0018). Apuntarlo a
    # http://generation:8080 vuelve a un solo motor sin cambiar código.
    GENERATION_BATCH_URL: ${GENERATION_BATCH_URL:-http://generation_batch:8080}
    EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embeddings:8080}
    RERANKER_URL: ${RERANKER_URL:-http://reranker:8080}
    GENERATION_MODEL_ALIAS: ${GENERATION_MODEL_ALIAS:-gemma-4-12b-it-qat-q4_0}
    GENERATION_MODEL_FILE: ${GENERATION_MODEL_FILE:-gemma-4-12b-it-qat-q4_0.gguf}
    GENERATION_MODEL_SHA256: ${GENERATION_MODEL_SHA256:-93567e57a8fe10b23569b9d9ec38cd005deedf71e29477c421a4b83f418a538b}
    GENERATION_CTX_SIZE: "${GENERATION_CTX_SIZE:-16384}"
    # Contexto propio del motor de lotes (plan 004, ADR-0037); lo registran la 003, la 008 y
    # la 004 con cada propuesta.
    GENERATION_BATCH_CTX_SIZE: "${GENERATION_BATCH_CTX_SIZE:-32768}"
    EMBEDDINGS_MODEL_ALIAS: ${EMBEDDINGS_MODEL_ALIAS:-bge-m3}
    EMBEDDINGS_MODEL_FILE: ${EMBEDDINGS_MODEL_FILE:-bge-m3-FP16.gguf}
    EMBEDDINGS_MODEL_SHA256: ${EMBEDDINGS_MODEL_SHA256:-daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c}
    RERANKER_MODEL_ALIAS: ${RERANKER_MODEL_ALIAS:-bge-reranker-v2-m3}
    RERANKER_MODEL_FILE: ${RERANKER_MODEL_FILE:-bge-reranker-v2-m3-FP16.gguf}
    RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:-5df93be121c09c43432102ad2b9569d369ccb85c209ca7583e8ccd28f0e41b88}
    # Importación desde el Portal de Compras (plan 012, ADR-0031). Los reciben todos los
    # servicios de la imagen (la aplicación valida con la lista el enlace que se registra),
    # pero solo `portal_worker` tiene salida a internet. Los valores por omisión son los de
    # evaluon/settings.py; tests/test_compose_env.py comprueba que coincidan.
    PORTAL_ALLOWED_HOSTS: ${PORTAL_ALLOWED_HOSTS:-afipcompras.afip.gob.ar}
    PORTAL_TIMEOUT_SECONDS: "${PORTAL_TIMEOUT_SECONDS:-30}"
    PORTAL_MAX_BYTES: "${PORTAL_MAX_BYTES:-52428800}"
    PORTAL_PAUSE_SECONDS: "${PORTAL_PAUSE_SECONDS:-2}"
    PORTAL_REVIEW_HOUR: "${PORTAL_REVIEW_HOUR:-7}"
    PORTAL_USER_AGENT: ${PORTAL_USER_AGENT:-EVALUON/1.0 (lectura de procesos publicos)}
  volumes:
    - ./evaluon:/app/evaluon:ro
    - ./tests:/app/tests:ro
    - ./scripts:/app/scripts:ro
    - ./manage.py:/app/manage.py:ro
    - ./pyproject.toml:/app/pyproject.toml:ro
    # Solo para tests/test_compose_env.py, que compara lo que ve la aplicación con lo que
    # usan los servicios de IA.
    - ./docker-compose.yml:/app/docker-compose.yml:ro
    - ./corpus:/app/corpus:ro
    - ./evals:/app/evals
  networks:
    - internal

services:
  db:
    # pgvector 0.8.7 sobre Postgres 17.11 (Debian 12), fijado en T-004 por etiqueta y huella:
    # la etiqueta se vuelve a publicar con cada versión menor de Postgres, la huella no
    # (ver specs/001-normativa/entorno.md, T-004). Trae vector, unaccent y la configuración
    # de búsqueda spanish.
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evaluon}
      POSTGRES_USER: ${POSTGRES_USER:-evaluon}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (copiar .env.example a .env y completarla)}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation:
    # Compilación de llama.cpp fijada en T-002 (ver specs/001-normativa/entorno.md).
    # Imagen con CUDA 12.8.1, que soporta la serie RTX 50.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11347
    command:
      - --model
      - /models/${GENERATION_MODEL_FILE:-gemma-4-12b-it-qat-q4_0.gguf}
      - --alias
      - ${GENERATION_MODEL_ALIAS:-gemma-4-12b-it-qat-q4_0}
      - --ctx-size
      - "${GENERATION_CTX_SIZE:-16384}"
      - --parallel
      - "1"
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      # Tope del caché de pedidos en la memoria del equipo (T-090). Por omisión es 8192 MiB
      # por servidor: dos servidores de generación lo llenan y el núcleo de WSL2 (15,3 GiB)
      # mata uno por falta de memoria, sin dejar error en el registro.
      - --cache-ram
      - "${GENERATION_CACHE_RAM:-2048}"
      - --no-context-shift
      - --offline
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  generation_batch:
    # Segunda instancia del motor, solo para los pedidos del `worker` y el comando de
    # medición (ADR-0018): misma imagen, compilación, modelo y argumentos que generation,
    # así la consulta de normativa no queda en fila detrás de una matriz y generation sigue
    # como se midió en la 001. El contexto es propio, `GENERATION_BATCH_CTX_SIZE` (32.768,
    # ADR-0037), para la lectura completa de la evaluación; cuesta más memoria de video.
    # tests/tenders/test_generation_batch.py comprueba que el command sea igual al de
    # generation salvo el contexto: al cambiar uno, cambiar los dos.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11347
    command:
      - --model
      - /models/${GENERATION_MODEL_FILE:-gemma-4-12b-it-qat-q4_0.gguf}
      - --alias
      - ${GENERATION_MODEL_ALIAS:-gemma-4-12b-it-qat-q4_0}
      - --ctx-size
      - "${GENERATION_BATCH_CTX_SIZE:-32768}"
      - --parallel
      - "1"
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      # Tope del caché de pedidos en la memoria del equipo (T-090). Por omisión es 8192 MiB
      # por servidor: dos servidores de generación lo llenan y el núcleo de WSL2 (15,3 GiB)
      # mata uno por falta de memoria, sin dejar error en el registro.
      - --cache-ram
      - "${GENERATION_CACHE_RAM:-2048}"
      - --no-context-shift
      - --offline
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  embeddings:
    # bge-m3, GGUF FP16 (ADR-0003). Misma imagen y compilación que generation.
    # Vector denso (agrupación CLS), normalizado por el servidor. Lote físico igual al
    # contexto: un texto entra entero en un solo paso, o se rechaza (ver entorno.md, T-003).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11347
    command:
      - --model
      - /models/${EMBEDDINGS_MODEL_FILE:-bge-m3-FP16.gguf}
      - --alias
      - ${EMBEDDINGS_MODEL_ALIAS:-bge-m3}
      - --embeddings
      - --pooling
      - cls
      - --ctx-size
      - "${EMBEDDINGS_CTX_SIZE:-8192}"
      - --batch-size
      - "${EMBEDDINGS_CTX_SIZE:-8192}"
      - --ubatch-size
      - "${EMBEDDINGS_CTX_SIZE:-8192}"
      - --parallel
      - "1"
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --no-context-shift
      - --offline
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  reranker:
    # bge-reranker-v2-m3, GGUF FP16 (ADR-0003). Misma imagen y compilación que generation.
    # El archivo no trae tokenizer.ggml.add_sep_token: sin forzarlo, el servidor arma el par
    # como "<s> pregunta </s> pasaje </s>" en lugar de "<s> pregunta </s></s> pasaje </s>"
    # (formato del modelo original) y los puntajes se apartan de los publicados
    # (ver entorno.md, T-003). Lote físico igual al contexto, como en embeddings.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11347
    command:
      - --model
      - /models/${RERANKER_MODEL_FILE:-bge-reranker-v2-m3-FP16.gguf}
      - --alias
      - ${RERANKER_MODEL_ALIAS:-bge-reranker-v2-m3}
      - --rerank
      - --override-kv
      - tokenizer.ggml.add_sep_token=bool:true
      - --ctx-size
      - "${RERANKER_CTX_SIZE:-8192}"
      - --batch-size
      - "${RERANKER_CTX_SIZE:-8192}"
      - --ubatch-size
      - "${RERANKER_CTX_SIZE:-8192}"
      - --parallel
      - "1"
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --no-context-shift
      - --offline
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  migrate:
    # Aplica las migraciones si la base está vacía; si tiene datos solo comprueba
    # (scripts/migrate_on_start.sh). Corre una vez y termina.
    <<: *app
    command: ["bash", "scripts/migrate_on_start.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    # Pantalla y comandos. Gunicorn con un proceso y cuatro hilos; espera de 120 s, porque
    # la de 30 s por omisión coincide con el máximo de una consulta (ADR-0005). El puerto
    # se publica solo en 127.0.0.1. La red `web` existe solo para publicar el puerto: una
    # red interna no publica puertos. corpus/ en solo lectura; evals/ con escritura para
    # guardar las corridas, y corpus/casos/ con escritura para las corridas de medición
    # de la matriz (`medir_matriz`, plan 003, "Medición"). La lista repite la de x-app
    # (una lista de YAML no se puede extender) y le suma ese montaje.
    <<: *app
    volumes:
      - ./evaluon:/app/evaluon:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./manage.py:/app/manage.py:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./corpus:/app/corpus:ro
      - ./corpus/casos:/app/corpus/casos
      - ./evals:/app/evals
    command:
      - gunicorn
      - evaluon.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      - internal
      - web
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      generation:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      # La hoja de estilos la sirve WhiteNoise dentro de la aplicación: si responde,
      # Gunicorn y Django están arriba. La imagen no trae curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/static/css/evaluon.css', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    # Pedidos en segundo plano (ADR-0018): leer documentos y proponer matrices, de a uno.
    # Misma imagen y variables que app, solo en la red interna y sin puertos. Al arrancar
    # pasa a fallidos los pedidos que quedaron a medias. Sin healthcheck: un pedido puede
    # durar una hora y no hay una respuesta que consultar mientras tanto; si el proceso
    # termina, Docker lo reinicia.
    <<: *app
    command: ["python", "manage.py", "procesar_pedidos"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      generation_batch:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped

  portal_worker:
    # Pedidos del Portal de Compras (ADR-0031): explorar y revisar un proceso público. Misma
    # imagen y variables que app. Es el ÚNICO servicio en la red `egress` (con salida a
    # internet) y además está en `internal` para llegar a la base; no depende de la IA ni
    # de la GPU. El código solo conecta a los hosts de PORTAL_ALLOWED_HOSTS, por HTTPS
    # (evaluon/portal/client.py). Para cortar la conexión: `docker compose stop
    # portal_worker` (ver specs/012-portal-compras/entorno.md). tests/portal/test_network.py
    # comprueba que ningún otro servicio use `egress`.
    <<: *app
    command: ["python", "manage.py", "procesar_portal"]
    networks:
      - internal
      - egress
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  internal:
    internal: true
  # Con salida a internet: solo la usa `portal_worker` (ADR-0031).
  egress:
  web:

volumes:
  pgdata:
