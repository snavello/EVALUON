# Salida a internet del clon de la feature 016, para el uso de una API externa de modelos
# (ADR-0066, punto 6; plan 016, "Plataforma externa"; REQ-122).
#
# Se usa SOLO junto con docker-compose.clon.yml:
#
#   docker compose -p evaluon-016 -f docker-compose.clon.yml -f docker-compose.externo.yml \
#       --env-file <archivo del clon> up -d
#
# Sin este archivo, ningún contenedor de trabajo tiene ruta a internet: el compose base no
# cambia (solo `portal_worker` está en `egress`, ADR-0031) y el clon tampoco lo tiene. Este
# archivo suma a `clon_worker` y `clon_app`, y a ningún otro servicio:
#
#   - la red `egress` (con salida a internet; en el proyecto del clon se llama
#     `evaluon-016_egress`, distinta de la de 8000);
#   - la clave del proveedor, `ANTHROPIC_API_KEY`, que se toma del --env-file del clon (fuera
#     del repositorio, P4). No tiene valor acá: sin ella, `docker compose` se detiene.
#
# Que el clon use de verdad lo externo lo deciden, además, `EXTERNAL_ENABLED` y
# `EXTERNAL_STAGES` (todo apagado por omisión). El código solo conecta a `api.anthropic.com`
# por HTTPS (evaluon/ai/external/client.py). Para cortar la salida: levantar el clon sin este
# archivo (o `docker network disconnect` de `evaluon-016_egress`) y revocar la clave.
# tests/portal/test_network.py comprueba que con este archivo `egress` llegue solo a esos dos.

services:
  clon_worker:
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Falta ANTHROPIC_API_KEY (archivo de --env-file del clon)}
    networks:
      - egress

  clon_app:
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Falta ANTHROPIC_API_KEY (archivo de --env-file del clon)}
    networks:
      - egress

networks:
  # Con salida a internet: solo la usan los dos servicios de arriba.
  egress:
