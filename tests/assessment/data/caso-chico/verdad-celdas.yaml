# Verdad celda por celda del caso chico (T-271; plan 016, "Paso 1"; ADR-0069, REQ-118).
# Caso INVENTADO y público (P4): ningún dato es real. Prueba el cargador, el conteo y la
# comprobación de las citas con 4 requisitos (M-001, M-003, M-004 y, en la oferta 1, un «cumple» por
# ausencia en M-005, con los documentos leídos).
