  fecha: 2026-10-15
  fuentes: [pliego.pdf, evaluacion-esperada.yaml, lectura de las ofertas]
visto_bueno: "Coordinador, 2026-10-15: verdad del caso chico para el corte vertical de T-271 (caso inventado)"
