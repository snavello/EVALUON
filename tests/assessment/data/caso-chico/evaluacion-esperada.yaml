# Lista esperada de la evaluación del caso chico (T-149; plan 004, "Listas esperadas").
# Caso INVENTADO y público (P4): ningún dato es real. Los PDF los genera `generar.py`.
# La forma de las ofertas (documentos que mezclan temas, escaneo con sello, póliza, hoja técnica,
# página ilegible, un documento exigido que falta, una copia de texto idéntico, una declaración
# jurada desfavorable) sigue la variedad de las ofertas del caso de referencia, sin copiar nada.
#
# `resultado` es uno de los cuatro: cumple, no_cumple, no_determinado, no_se_encontro_documento.
# `base`: oferta (documentos de la oferta), externa (se verifica fuera de la oferta: la hoja de
# compliance, decisión 1 del responsable 2026-10-06) o tecnica (requisito por renglón, decisión 2).
# `motivo` de un no_determinado: falta_hoja_compliance, pagina_ilegible, lectura_incompleta,
# pendiente_informe_tecnico (fila técnica) o no_se_pudo_leer (con `ilegible`); con `pregunta: si`
# el par debe traer una pregunta para la Comisión. `citas` son literales de la oferta (documento,
# página y fragmento exacto del texto leído); un cumple o un no_cumple lleva al menos una.
# Regla nueva (enmienda 2026-10-06, T-170): la coincidencia se cuenta por tipo de par. Una fila
# técnica trae `documento_tecnico` (hay o no_se_encontro) y `renglon_ofertado` (si, no o
# no_aplica), y su `dictamen` (lo que dice el área técnica, para comparar la opinión del sistema);
# un documento ilegible, `ilegible: {documento, pagina}`; un dato que el dictamen sustenta con el
# Portal, `portal: {tipo, valor}` (tipo: garantia, cotizacion, total o cuit). El caso chico no
# carga el Portal: el par con `portal` se mide con las tablas del Portal cargadas, o queda
# informado como no coincidente.
# Las anclas de documentos escaneados las comprueba `medir_evaluacion --verificar-esperada`.
