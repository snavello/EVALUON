# Motor de la Consulta apagado (T-247, ADR-0057): `generation` (el 12B de la Consulta de
# normativa) no se levanta con `docker compose up`. Se SUMA a los de la configuración del 27B:
#   docker-compose.yml + docker-compose.qwen38-27b.yml + docker-compose.razonamiento.yml
#
# Qué es hoy este archivo (T-255): el 27B SIN Consulta. La configuración de uso de `.env.example` ya
# no lo trae: trae docker-compose.consulta-27b.yml, que lleva la Consulta al motor del 27B («Sí;
# Consulta con el 27B», 2026-10-12). Este archivo queda para dos casos: si las evals de la 001 no
# pasan con el 27B (P7), o para volver atrás después de desplegar la Consulta en el 27B (es lo que
# corría antes de T-255). Se usa cambiando el último archivo de `COMPOSE_FILE`
# (docker-compose.consulta-27b.yml por este) y recreando `app` y `worker`. La pantalla de la Consulta
# y la pestaña de Normativas dicen entonces que no está disponible por ahora (no fallan): la Consulta
# sigue apuntando a `generation`, que no arranca.
#
# Por qué `generation` no arranca: con el Qwen3.8-27B en `generation_batch` la GPU ocupa unos 20.960
# MiB de 24.463; el 12B de la Consulta (unos 7.800 MiB más) no entra (T-244, T-244d).
#
# Qué cambia: `generation` pasa al perfil `consulta-12b` (un servicio con perfil no arranca salvo que
# se pida) y `app` deja de esperarlo (`required: false`). Nada más: ni redes, ni puertos, ni
# imágenes (tests/test_compose_env.py lo comprueba; P4).
#
# Para volver al 12B con la Consulta: no usar nada de esto (ver
# specs/015-uso-y-eleccion-del-modelo/entorno.md, «Cómo se vuelve al 12B»).

services:
  generation:
    profiles: ["consulta-12b"]

  app:
    depends_on:
      generation:
        condition: service_healthy
        required: false
