{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EVALUON{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/evaluon.css' %}">
</head>
<body>
  <header class="site-header">
    <span class="site-name">EVALUON</span>
    {% if user.is_authenticated %}
    {% if user.commission_role %}
    <nav class="site-nav" aria-label="Secciones">
      <a href="{% url 'queries:screen' %}">Consulta</a>
      <a href="{% url 'tenders:procedures' %}">Procedimientos</a>
    </nav>
    {% endif %}
    <span class="site-user">{{ user.username }}</span>
    <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
      {% csrf_token %}
      <button type="submit">Salir</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
