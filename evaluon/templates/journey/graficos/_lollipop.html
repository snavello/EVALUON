{% comment %}Orden económico de menor a mayor, con la más baja (lima con contorno ink) y la más alta (ink) como indicadores (T-314). Variable: `chart` (charts.Lollipop).{% endcomment %}<svg viewBox="{{ chart.view_box }}" width="100%" role="img" aria-labelledby="{{ chart.title_id }} {{ chart.desc_id }}" class="grafico grafico-lollipop" font-size="11">
<title id="{{ chart.title_id }}">{{ chart.title }}</title>
<desc id="{{ chart.desc_id }}">{{ chart.description }}</desc>
{% if chart.has_data %}{% for t in chart.ticks %}<line x1="{{ t.x }}" x2="{{ t.x }}" y1="{{ t.y1 }}" y2="{{ t.y2 }}" stroke="currentColor" stroke-dasharray="2 4" class="g-line"/>
<text x="{{ t.x }}" y="{{ t.ty }}" text-anchor="middle" font-size="10" fill="currentColor" class="g-ink2">{{ t.label }}</text>
{% endfor %}{% endif %}{% for p in chart.geometry %}<text x="0" y="{{ p.ty }}" fill="currentColor" class="g-ink">{{ p.label }}</text>
<line x1="{{ p.x1 }}" x2="{{ p.x }}" y1="{{ p.y }}" y2="{{ p.y }}" stroke="currentColor" stroke-width="2" class="{% if p.low %}g-ink{% else %}g-mute{% endif %}"/>
{% if p.low %}<circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.outer }}" fill="currentColor" class="g-ink"/>
<circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.inner }}" fill="currentColor" class="g-lime"/>
{% elif p.high %}<circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.inner }}" fill="currentColor" class="g-ink"/>
{% else %}<circle cx="{{ p.x }}" cy="{{ p.y }}" r="6" fill="none" stroke="currentColor" stroke-width="2" class="g-mute"/>
{% endif %}<text x="{{ p.vx }}" y="{{ p.vy }}" font-size="12" fill="currentColor" class="g-ink">{{ p.text }}</text>
{% if p.note %}<text x="{{ p.vx }}" y="{{ p.ny }}" font-size="10" fill="currentColor" class="g-ink2">{{ p.note }}</text>
{% endif %}{% endfor %}</svg>
