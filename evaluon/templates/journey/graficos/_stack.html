{% comment %}Barra apilada con hueco entre series y leyenda (T-314). Variable: `chart` (charts.Stack).{% endcomment %}<svg viewBox="{{ chart.view_box }}" width="100%" role="img" aria-labelledby="{{ chart.title_id }} {{ chart.desc_id }}" class="grafico grafico-stack" font-size="11">
<title id="{{ chart.title_id }}">{{ chart.title }}</title>
<desc id="{{ chart.desc_id }}">{{ chart.description }}</desc>
{% for s in chart.geometry %}{% if s.lime %}<rect x="{{ s.ox }}" y="{{ s.oy }}" width="{{ s.ow }}" height="{{ s.oh }}" rx="3" fill="currentColor" class="g-ink"/>
{% endif %}<rect x="{{ s.x }}" y="0" width="{{ s.w }}" height="{{ s.h }}" rx="2" fill="currentColor" class="g-{{ s.tone }}"/>
{% endfor %}{% if chart.has_data %}{% for l in chart.legend %}{% if l.lime %}<rect x="-1.5" y="{{ l.y }}" width="13" height="13" rx="2" fill="currentColor" class="g-ink"/>
{% endif %}<rect x="0" y="{{ l.y }}" width="10" height="10" rx="2" fill="currentColor" class="g-{{ l.tone }}"/>
<text x="18" y="{{ l.ty }}" fill="currentColor" class="g-ink">{{ l.text }}</text>
{% endfor %}{% endif %}</svg>
