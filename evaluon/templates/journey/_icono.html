{% comment %}Ícono de estado. Recibe `icon` (cumple, nocumple, nodet, pend) y `name`. El nombre aparece al pasar el mouse o con el foco (guía visual); `tip=False` lo deja solo en el título cuando el ícono va dentro de un enlace.{% endcomment %}<span class="est {{ icon }}"{% if tip != False %} tabindex="0"{% endif %} role="img" aria-label="{{ name }}" title="{{ name }}" data-nombre="{{ name }}"><svg aria-hidden="true"><use href="#i-{{ icon }}"/></svg></span>
