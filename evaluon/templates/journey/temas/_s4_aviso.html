{% comment %}El aviso de lo hecho por una acción de Evaluación (T-335), dentro del detalle del tema que la hizo. Variables: `aviso` ({ok, text} o nada) e `ident` (el id al que vuelve la acción).{% endcomment %}{% if aviso %}<p class="aviso {% if aviso.ok %}aviso-ok{% else %}aviso-error{% endif %}" id="{{ ident }}" role="{% if aviso.ok %}status{% else %}alert{% endif %}">{{ aviso.text }}</p>{% endif %}
