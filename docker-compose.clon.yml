# Instancia clonada de la feature 016 (specs/016-calidad-medible/entorno.md; plan 016,
# "Instancia clonada y ritmo de trabajo"; REQ-125).
# Segunda aplicación con su propia base, restaurada de un respaldo nuevo de la de trabajo
# (puerto 8000): proyecto `evaluon-016`, base propia (`clon_db`, volumen `clon_pgdata`),
# `clon_migrate`, `clon_app`, `clon_worker` y, solo en las ventanas de medición, el motor
# propio `clon_generation_batch` (Qwen3.8-27B). Comparte de la pila `evaluon` solo
# `embeddings` y `reranker`, por su red `evaluon_internal` (que tiene que estar levantada) y
# en lectura. No toca ningún contenedor ni volumen `evaluon-*`.
#
# Los nombres de servicio llevan el prefijo `clon_` a propósito: en la red compartida cada
# servicio se alcanza por su nombre, y `db`, `app` o `generation_batch` chocarían con los de la
# pila real (la lección de docker-compose.demo.yml).
#
# GPU: una sola instancia usa el motor a la vez. `clon_generation_batch` está en el perfil
# `motor`: `docker compose up -d` no lo arranca; lo arranca scripts/clon.sh ventana-abrir, que
# antes detiene el motor y el `worker` de 8000 (y ventana-cerrar los devuelve).
#
# P4: la base y el motor están solo en `clon_internal` (sin salida y sin puertos). `clon_app` y
# `clon_worker` no tienen salida a internet (no están en `egress` ni en ninguna red con ella
# salvo `clon_web`, que existe para publicar el puerto de `clon_app`, como `web` en la pila
# real). El uso de un modelo externo, si se aprueba, llega con otro archivo (T-289).
# Los secretos van en un archivo fuera del repositorio (--env-file); ver scripts/clon.sh.
#
# Variables que lee (todas del --env-file que genera scripts/clon.sh; sin ruta fija aquí):
#   CLON_CODE_DIR    carpeta con el código que se monta (copia de trabajo de `016-integracion`
#                    o una copia fija hecha con `git archive` para una medición)
#   CLON_MODELS_DIR  carpeta `models/` con los archivos .gguf (en solo lectura)
#   CLON_CASOS_DIR   carpeta de casos del clon (corpus/casos del clon, con escritura)
#   CLON_PORT        puerto en 127.0.0.1 (8016 por omisión)

name: evaluon-016

x-clon-app: &clon-app
  # La misma imagen ya construida para la pila real (no se reconstruye ni se retaga).
  image: evaluon-app:local
  pull_policy: never
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Falta DJANGO_SECRET_KEY (archivo de --env-file)}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: evaluon_clon
    POSTGRES_USER: evaluon_clon
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (archivo de --env-file)}"
    POSTGRES_HOST: clon_db
    POSTGRES_PORT: "5432"
    # Motor propio del clon (el Qwen3.8-27B): la Consulta y los pedidos de lotes van al mismo
    # motor, como en 8000 con docker-compose.consulta-27b.yml. `embeddings` y `reranker` son los
    # de 8000, por la red compartida.
    GENERATION_URL: http://clon_generation_batch:8080
    GENERATION_BATCH_URL: http://clon_generation_batch:8080
    EMBEDDINGS_URL: http://embeddings:8080
    RERANKER_URL: http://reranker:8080
    # Modelo de generación y de lotes: los mismos valores que docker-compose.qwen38-27b.yml
    # (tests/test_clon_compose.py lo comprueba).
    GENERATION_MODEL_ALIAS: qwen3.8-27b-ud-q4_k_m
    GENERATION_MODEL_FILE: Qwen3.8-27B-UD-Q4_K_M.gguf
    GENERATION_MODEL_SHA256: 322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
    GENERATION_CTX_SIZE: "${GENERATION_BATCH_CTX_SIZE:-32768}"
    GENERATION_BATCH_CTX_SIZE: "${GENERATION_BATCH_CTX_SIZE:-32768}"
    GENERATION_BATCH_MODEL_ALIAS: qwen3.8-27b-ud-q4_k_m
    GENERATION_BATCH_MODEL_FILE: Qwen3.8-27B-UD-Q4_K_M.gguf
    GENERATION_BATCH_MODEL_SHA256: 322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
    GENERATION_BATCH_MMPROJ_FILE: mmproj-Qwen3.8-27B-F16.gguf
    GENERATION_BATCH_MMPROJ_SHA256: cbb841a9ee0636b2ec172f5bb8df2ea8dfeb01e90fe7c6126581d662a0b4e43e
    EMBEDDINGS_MODEL_ALIAS: ${EMBEDDINGS_MODEL_ALIAS:-bge-m3}
    EMBEDDINGS_MODEL_FILE: ${EMBEDDINGS_MODEL_FILE:-bge-m3-FP16.gguf}
    EMBEDDINGS_MODEL_SHA256: ${EMBEDDINGS_MODEL_SHA256:-daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c}
    RERANKER_MODEL_ALIAS: ${RERANKER_MODEL_ALIAS:-bge-reranker-v2-m3}
    RERANKER_MODEL_FILE: ${RERANKER_MODEL_FILE:-bge-reranker-v2-m3-FP16.gguf}
    RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:-5df93be121c09c43432102ad2b9569d369ccb85c209ca7583e8ccd28f0e41b88}
    PORTAL_ALLOWED_HOSTS: ${PORTAL_ALLOWED_HOSTS:-afipcompras.afip.gob.ar}
    PORTAL_TIMEOUT_SECONDS: "${PORTAL_TIMEOUT_SECONDS:-30}"
    PORTAL_MAX_BYTES: "${PORTAL_MAX_BYTES:-52428800}"
    PORTAL_PAUSE_SECONDS: "${PORTAL_PAUSE_SECONDS:-2}"
    PORTAL_REVIEW_HOUR: "${PORTAL_REVIEW_HOUR:-7}"
    PORTAL_USER_AGENT: ${PORTAL_USER_AGENT:-EVALUON/1.0 (lectura de procesos publicos)}
    # Razonamiento propio del modelo (docker-compose.razonamiento.yml): `low` solo en el
    # contraste, que es la configuración adoptada en la 015. Cada variable se puede cambiar en
    # el --env-file para una variante de medición (`off` o un nivel); el motor de abajo ya
    # permite pensar, y el tope de cada pedido lo pone el propio pedido.
    GENERATION_BATCH_REASONING_EXTRACTION: ${GENERATION_BATCH_REASONING_EXTRACTION:-}
    GENERATION_BATCH_REASONING_COMPLETENESS: ${GENERATION_BATCH_REASONING_COMPLETENESS:-}
    GENERATION_BATCH_REASONING_FILTER: ${GENERATION_BATCH_REASONING_FILTER:-}
    GENERATION_BATCH_REASONING_EVALUATION: ${GENERATION_BATCH_REASONING_EVALUATION:-}
    GENERATION_BATCH_REASONING_CONTRAST: ${GENERATION_BATCH_REASONING_CONTRAST:-low}
    GENERATION_BATCH_REASONING_BUDGET_LOW: ${GENERATION_BATCH_REASONING_BUDGET_LOW:-}
    GENERATION_BATCH_REASONING_BUDGET_MEDIUM: ${GENERATION_BATCH_REASONING_BUDGET_MEDIUM:-}
    GENERATION_BATCH_REASONING_BUDGET_HIGH: ${GENERATION_BATCH_REASONING_BUDGET_HIGH:-}
    GENERATION_BATCH_REASONING_EXTRA_TIMEOUT_SECONDS: ${GENERATION_BATCH_REASONING_EXTRA_TIMEOUT_SECONDS:-}
  volumes:
    # El código, en solo lectura: la copia de trabajo de `016-integracion` o, en una medición,
    # una copia fija (`git archive`) del commit que se mide.
    - ${CLON_CODE_DIR:?Falta CLON_CODE_DIR (carpeta con el código; ver specs/016-calidad-medible/entorno.md)}/evaluon:/app/evaluon:ro
    - ${CLON_CODE_DIR}/tests:/app/tests:ro
    - ${CLON_CODE_DIR}/scripts:/app/scripts:ro
    - ${CLON_CODE_DIR}/manage.py:/app/manage.py:ro
    - ${CLON_CODE_DIR}/pyproject.toml:/app/pyproject.toml:ro
    # El corpus de normativa, por partes: montar `corpus/` entero en solo lectura impide montar
    # encima `corpus/casos` (el motor de contenedores no puede crear el punto de montaje).
    - ${CLON_CODE_DIR}/corpus/normativa:/app/corpus/normativa:ro
    - ${CLON_CODE_DIR}/corpus/manifiesto.csv:/app/corpus/manifiesto.csv:ro
    - ${CLON_CODE_DIR}/corpus/README.md:/app/corpus/README.md:ro
    - ${CLON_CODE_DIR}/specs:/app/specs:ro
    # Los casos del clon, con escritura (corridas de medición); aparte de los de 8000.
    - ${CLON_CASOS_DIR:?Falta CLON_CASOS_DIR (archivo de --env-file)}:/app/corpus/casos
    - ${CLON_CODE_DIR}/evals:/app/evals
  networks:
    - clon_internal

services:
  clon_db:
    # Misma imagen (y huella) que `db` de la pila real; base y usuario propios, volumen propio.
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: evaluon_clon
      POSTGRES_USER: evaluon_clon
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (archivo de --env-file)}"
    volumes:
      - clon_pgdata:/var/lib/postgresql/data
    networks:
      - clon_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  clon_migrate:
    # Base vacía: aplica las migraciones. Base con datos (la restaurada): solo comprueba.
    # Las pendientes sobre la base restaurada las aplica `scripts/clon.sh restaurar`.
    <<: *clon-app
    command: ["bash", "scripts/migrate_on_start.sh"]
    depends_on:
      clon_db:
        condition: service_healthy
    restart: "no"

  clon_app:
    <<: *clon-app
    command:
      - gunicorn
      - evaluon.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
    ports:
      - "127.0.0.1:${CLON_PORT:-8016}:8000"
    networks:
      - clon_internal
      - evaluon_internal   # solo para llegar a `embeddings` y `reranker` compartidos
      - clon_web
    depends_on:
      clon_db:
        condition: service_healthy
      clon_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/static/css/evaluon.css', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: "no"

  clon_worker:
    # Igual que `worker`: atiende los pedidos de a uno. No depende del motor: sin la ventana
    # abierta los pedidos fallan al pedirle al motor; las mediciones corren con la ventana.
    <<: *clon-app
    command: ["python", "manage.py", "procesar_pedidos"]
    networks:
      - clon_internal
      - evaluon_internal   # `embeddings` y `reranker` compartidos
    depends_on:
      clon_db:
        condition: service_healthy
      clon_migrate:
        condition: service_completed_successfully
    restart: "no"

  clon_generation_batch:
    # Motor propio del clon: Qwen3.8-27B. El `command` y la espera de la carga son los de
    # docker-compose.qwen38-27b.yml (se heredan con `extends`: una sola fuente); la imagen, el
    # volumen, la GPU y el chequeo de salud son los de `generation_batch` del compose base, y el
    # `entrypoint` es el de docker-compose.razonamiento.yml (permite pensar; el tope de cada
    # pedido lo pone el pedido y solo el contraste lo enciende). tests/test_clon_compose.py
    # comprueba que sigan iguales. Solo en la red del clon: 8000 no lo alcanza, ni al revés.
    extends:
      file: docker-compose.qwen38-27b.yml
      service: generation_batch
    profiles: ["motor"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11347
    entrypoint:
      - /bin/sh
      - -c
      - exec /app/llama-server "$$@" --reasoning auto --reasoning-budget -1
      - llama-server
    volumes:
      - ${CLON_MODELS_DIR:?Falta CLON_MODELS_DIR (archivo de --env-file)}:/models:ro
    networks:
      - clon_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: "no"

networks:
  clon_internal:
    internal: true
  # Solo para publicar el puerto de `clon_app` (una red interna no publica puertos).
  clon_web:
  # Red de la pila real, que debe estar levantada; el clon no la crea ni la borra.
  evaluon_internal:
    external: true

volumes:
  clon_pgdata:
