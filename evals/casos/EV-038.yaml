id: EV-038
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Cuánto puede cobrar la AFIP por el pliego de una licitación?"
fecha_autorizacion: 2024-05-20
regimen: "Disposición AFIP 247/2022"
esperado: |
  Cuando la unidad con capacidad de contratación entrega copias del pliego de bases y condiciones particulares, puede cobrar una suma equivalente al costo de reproducción del pliego, que se establece en la convocatoria. Esa suma no se devuelve bajo ningún concepto.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 27, inciso b), punto 2"}
origen: |
  2. Costo del pliego: En aquellos casos en que las unidades con capacidad de contratación entreguen copias del pliego de bases y condiciones particulares, podrán establecer para su entrega el pago de una suma equivalente al costo de reproducción del mismo, la que deberá ser establecida en la convocatoria. La suma abonada en ese sentido no será devuelta bajo ningún concepto.
unidades:
