notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  La pregunta no usa las palabras de la norma ("desdoblamiento", "fraccionar"). El primer párrafo remite los montos y las competencias al régimen jurisdiccional vigente, que no está cargado; la pregunta pide la presunción, que sí está en el artículo. Una respuesta que dé montos de encuadre da contenido no cargado y es incorrecta.
