id: EV-049
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Hasta qué monto se puede usar el trámite simplificado?"
fecha_autorizacion: 2025-12-01
regimen: "Disposición AFIP 247/2022"
esperado: |
  El trámite simplificado puede usarse en las contrataciones directas y en las licitaciones privadas cuando el monto estimado no supere el establecido para este supuesto en el régimen jurisdiccional vigente, y el procedimiento es válido cuando el monto total a adjudicar no supera el máximo fijado para su encuadre según ese régimen. El anexo de la Disposición 247/2022 no fija el monto: remite al régimen jurisdiccional vigente.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 22"}
origen: |
  ARTÍCULO 22.- TRÁMITE SIMPLIFICADO. Podrá utilizarse este trámite en las contrataciones directas y en las licitaciones privadas cuando el monto estimado no supere el establecido para este supuesto en el régimen jurisdiccional vigente.
  [...]
  El procedimiento de selección será válido cuando el monto total a adjudicar no supere el máximo fijado para su encuadre según el régimen jurisdiccional vigente.
