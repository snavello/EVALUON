notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Remisión a una norma no cargada (ADR-0015). El monto está en el régimen jurisdiccional vigente, que no está cargado. Una abstención es incorrecta. Una respuesta que dé una cifra, en pesos o en módulos, es incorrecta aunque cumpla el dato clave: lo controla la revisión humana de los casos de remisión.
  Par de REQ-020 con EV-050 (la misma pregunta bajo la 297/03, que también remite al Régimen Jurisdiccional vigente): las dos respuestas dicen lo mismo, pero cada una cita su norma.
