id: EV-027
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Hasta qué monto se puede hacer una licitación privada?"
fecha_autorizacion: 2025-06-30
regimen: "Disposición AFIP 247/2022"
esperado: |
  La licitación o concurso privado es aplicable cuando el monto estimado no supere el estipulado en el régimen jurisdiccional vigente para este tipo de contrataciones, y el procedimiento es válido cuando el monto total a adjudicar no supere el máximo fijado para su encuadre en ese régimen. El anexo de la Disposición 247/2022 no fija el monto: remite al régimen jurisdiccional vigente.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 21, inciso c)"}
origen: |
  c) Licitación o Concurso Privado: La licitación o el concurso será privado cuando el llamado a participar esté dirigido exclusivamente a proveedores que se hallaren incorporados en el Registro de Proveedores que diseñe, implemente y administre el órgano rector y será aplicable cuando el monto estimado no supere el estipulado en el régimen jurisdiccional vigente para este tipo de contrataciones.
  En estos procedimientos también serán consideradas las ofertas de quienes no hubiesen sido expresamente invitados a participar.
  El procedimiento de selección elegido será válido cuando el monto total a adjudicar no supere el máximo fijado para su encuadre en el régimen jurisdiccional vigente.
unidades:
