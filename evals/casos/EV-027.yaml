notas: |
  Caso dudoso: el sistema podría responder citando el artículo 21 c) que el monto lo fija el régimen jurisdiccional. ¿Eso cuenta como respuesta correcta o como abstención? Lo dejamos como "no determinado" porque la pregunta pide una cifra.
