id: EV-002
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Qué clases de garantías deben constituir los oferentes y contratistas y por qué porcentaje?"
fecha_autorizacion: 2024-04-08
regimen: "Disposición AFIP 247/2022"
esperado: |
  De mantenimiento de la oferta, por el cinco por ciento (5 %) del monto ofertado (en etapa múltiple, un monto fijo que establece el pliego); de cumplimiento del contrato, por el diez por ciento (10 %) del valor total de la orden de compra, de venta o del contrato; y contragarantía, por el equivalente de los adelantos que reciba el contratista.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 64, incisos a), b) y c)"}
origen: |
  a) De mantenimiento de la oferta: por el CINCO POR CIENTO (5%) del valor total del monto ofertado. En el caso de cotizar con descuentos, alternativas o variantes, la garantía se calculará sobre el mayor monto propuesto. En licitaciones y concursos de etapa múltiple, la garantía de mantenimiento de la oferta será establecida en un monto fijo en el pliego de bases y condiciones particulares. b) De cumplimiento del contrato: por el DIEZ POR CIENTO (10%) del valor total de la orden de compra o de venta o el contrato. c) Contragarantía: por el equivalente de los montos que reciba el contratista como adelanto en aquellas contrataciones en que así se hubiese previsto en el pliego de bases y condiciones particulares.
