origen: |
  Pregunta ajena a la normativa de compras: ninguna norma cargada trata el tránsito ni remite a otra norma sobre él. Búsqueda por palabras, sin tildes ni mayúsculas, sobre el texto canónico de la lectura de la Disposición AFIP 247/2022 (cuerpo y anexo) y de la Disposición AFIP 297/03 con su Anexo I (2026-10-03): "velocidad", "autopista", "kilometr", "km/h", "ruta" y "conducir" no aparecen. "transito" aparece solo dentro de "transitorio" y "transitoria", y "vehicul" solo en la contratación directa para reparar vehículos.
