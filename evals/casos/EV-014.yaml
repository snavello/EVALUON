documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Puede el pliego de bases y condiciones particulares agregar causales propias para desestimar ofertas?"
fecha_autorizacion: 2025-02-10
regimen: "Disposición AFIP 247/2022"
esperado: |
  No. Los pliegos no pueden prever otras causales de desestimación no subsanables además de las que enumera el artículo 55.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 55, anteúltimo párrafo"}
origen: |
  En los pliegos de bases y condiciones particulares no se podrán prever otras causales de desestimación no subsanables de ofertas.
unidades:
  - {norma: "Disposición AFIP 247/2022", key: anexo/art-55}
