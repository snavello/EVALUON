id: EV-007
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "Si el pliego no prevé multas, ¿qué multa corresponde por entregar fuera de término?"
fecha_autorizacion: 2025-03-12
regimen: "Disposición AFIP 247/2022"
esperado: |
  Una multa por mora del cero coma uno por ciento (0,1 %) del valor de lo satisfecho fuera de término por cada día hábil de atraso. Las multas nunca pueden superar el cien por ciento (100 %) del valor del contrato.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 88, inciso c)"}
origen: |
  Para el supuesto que no se previera expresamente se aplicará una multa por mora en el cumplimiento de las prestaciones del CERO COMA UNO POR CIENTO (0,1%) del valor de lo satisfecho fuera del término por cada día hábil de atraso. En ningún caso las multas podrán superar el CIEN POR CIENTO (100%) del valor del contrato.
