id: EV-004
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "Si un proveedor cotiza un importe chico, ¿igual tiene que presentar garantía de oferta?"
fecha_autorizacion: 2025-07-21
regimen: "Disposición AFIP 247/2022"
esperado: |
  No es necesario presentar la garantía de mantenimiento de la oferta cuando el monto de la oferta no supera la cantidad que representan mil módulos (M 1.000). Aun así, el oferente queda obligado a responder por el importe de la garantía no constituida si la AFIP lo requiere.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 66, inciso f) y párrafo final"}
origen: |
  f) Cuando el monto de la oferta no supere la cantidad que representan UN MIL MÓDULOS (M 1.000), la garantía de mantenimiento de la oferta.
  [...]
  No obstante lo dispuesto, todos los oferentes, adjudicatarios y contratistas quedan obligados a responder por el importe de la garantía no constituida, de acuerdo al orden de afectación de penalidades establecido en el presente régimen, a requerimiento de la AFIP sin que proceda reclamo alguno sino después de obtenido el cobro o de efectuado el pago.
unidades:
  - {norma: "Disposición AFIP 247/2022", key: anexo/art-66}
datos_clave: ["no es necesario", "M 1.000"]
difieren: false
pareja: ""
aviso_modificatorias: false
etiquetas: ["palabras distintas a las de la norma"]
visto_bueno: "provisorio, autorizado por el responsable el 2026-10-03"   # se revisa con la Comisión
redactado_por: borrador asistido
notas: |
  La pregunta no usa las palabras de la norma ("importe chico", "garantía de oferta"). El valor en pesos del módulo no está en la normativa cargada (art. 99: lo fija la máxima autoridad); la respuesta correcta se queda en M 1.000.
