notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Pregunta de "¿puede…?": el "sí" lleva variantes escritas ("puede rechazar" del esperado, "podrá rechazar" del origen), porque la respuesta puede no empezar con "Sí". "pierde la garantía" es una forma del mismo dato que la respuesta puede usar; la del origen es "pérdida de la garantía". El mismo plazo de tres días aparece entre las penalidades del anexo, pero el caso exige solo este artículo.
