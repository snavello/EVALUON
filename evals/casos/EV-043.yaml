id: EV-043
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿El adjudicatario puede rechazar la orden de compra después de que se la notifican?"
fecha_autorizacion: 2025-10-06
regimen: "Disposición AFIP 247/2022"
esperado: |
  Sí. El contrato queda perfeccionado al notificarse la orden de compra, y el contratista puede rechazarla dentro de los tres (3) días de su perfeccionamiento, con la pérdida de la garantía de mantenimiento de oferta o monto equivalente y las sanciones que correspondan según la reglamentación. En ese caso la autoridad competente puede adjudicar al oferente que sigue en orden de mérito.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 60"}
origen: |
  ARTÍCULO 60.- PERFECCIONAMIENTO DEL CONTRATO. Los contratos quedarán perfeccionados al momento de notificarse la orden de compra o de venta al adjudicatario, o en oportunidad de suscribirse aquellos.
  [...]
  El contratista podrá rechazar la orden de compra o venta dentro de los TRES (3) días de su perfeccionamiento, sin perjuicio de la pérdida de la garantía de mantenimiento de oferta o monto equivalente y las sanciones que por tal motivo pudieran corresponder de acuerdo con lo que establezca la reglamentación. La autoridad competente, según el régimen jurisdiccional vigente, podrá adjudicar el contrato al oferente que siga en orden de mérito y así sucesivamente.
unidades:
