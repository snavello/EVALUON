id: EV-001
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Por cuánto tiempo debe un oferente mantener su oferta cuando el pliego no fija un plazo de mantenimiento?"
fecha_autorizacion: 2023-01-01
regimen: "Disposición AFIP 247/2022"
esperado: |
  Sesenta (60) días corridos contados desde la fecha del acto de apertura, sin contar el día de la apertura. El plazo se prorroga automáticamente por un lapso igual, salvo que el oferente manifieste en forma fehaciente que no lo renueva con al menos cinco (5) días hábiles de antelación al vencimiento.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 43"}
origen: |
  Los oferentes deberán mantener las ofertas por un plazo de SESENTA (60) días corridos, salvo que en el pliego de bases y condiciones particulares se establezca uno distinto, contados a partir de la fecha del acto de apertura. El día de la apertura quedará excluido del cómputo del plazo. El plazo de mantenimiento se considerará prorrogado automáticamente por un lapso igual al inicial y así sucesivamente. Si el oferente quisiera manifestar su voluntad de no renovar el mantenimiento de la oferta, deberá hacerlo en forma fehaciente con una antelación mínima de CINCO (5) días hábiles anteriores al vencimiento del plazo respectivo.
unidades:
  - {norma: "Disposición AFIP 247/2022", key: anexo/art-43}
