id: EV-044
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Qué pasa con las muestras que un oferente nunca pasa a buscar?"
fecha_autorizacion: 2024-02-26
regimen: "Disposición AFIP 247/2022"
esperado: |
  Si el oferente o contratista no retira las muestras dentro del plazo de sesenta (60) días corridos contados desde la fecha de la notificación que se le curse a tal fin, eso implica la renuncia tácita a favor de la AFIP.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 28, último párrafo"}
origen: |
  Si los oferentes o contratistas no retirasen las muestras dentro del plazo de SESENTA (60) días corridos a contar desde la fecha de la notificación que se curse a tal fin, dicha situación implicará la renuncia tácita a favor de la AFIP.
unidades:
  - {norma: "Disposición AFIP 247/2022", key: anexo/art-28}
datos_clave: ["60 días corridos", "renuncia tácita"]
