id: EV-048
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Cómo se integra la comisión de recepción?"
fecha_autorizacion: 2024-07-01
regimen: "Disposición AFIP 247/2022"
esperado: |
  En cada unidad con capacidad de contratación funciona una comisión de recepción. Su integración, sus condiciones de funcionamiento y los criterios de designación de sus miembros quedan sujetos a la reglamentación que se dicte: el anexo de la Disposición 247/2022 no fija la integración. Sus integrantes no pueden ser funcionarios que hubieran intervenido en el procedimiento de contratación respectivo.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 73"}
origen: |
  ARTÍCULO 73.- COMISIONES DE RECEPCIÓN. En cada unidad con capacidad de contratación funcionará una comisión de recepción cuya integración y condiciones de funcionamiento en general, así como los criterios de designación de sus miembros, quedarán sujetos a la reglamentación que se dicte.
  Los integrantes de dicha comisión no podrán ser funcionarios que hubieran intervenido en el procedimiento de contratación respectivo.
unidades:
