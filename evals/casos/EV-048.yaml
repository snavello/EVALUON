notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Remisión a una norma no cargada (ADR-0015; plan, "Remisión a una norma no cargada"). Es la remisión que señaló el aviso de T-064 en tasks.md: la integración de la comisión de recepción queda "sujeta a la reglamentación que se dicte", que no está cargada. Una abstención es incorrecta. Una respuesta que dé una integración (por ejemplo, "tres miembros", como la comisión de recepción de la 297/03) es incorrecta aunque cumpla el dato clave: lo controla la revisión humana de los casos de remisión. No se pide que diga quiénes no pueden integrarla: está en el esperado, no en los datos clave.
  No se armó par con la 297/03: su comisión de recepción está en un artículo que ya usa el lote de ajuste.
