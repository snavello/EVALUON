id: EV-034
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Cuál es el plazo mínimo para que los interesados formulen observaciones al proyecto de pliego de bases y condiciones particulares?"
fecha_autorizacion: 2023-01-03
regimen: "Disposición AFIP 247/2022"
esperado: |
  Cuando la complejidad o el monto lo justifiquen y se abre la etapa previa para recibir observaciones al proyecto de pliego, el plazo para recibirlas es de diez (10) días corridos como mínimo, contados desde la última fecha de publicación del llamado en el Boletín Oficial, donde se publica por dos (2) días.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 30"}
origen: |
  ARTÍCULO 30.- OBSERVACIONES AL PROYECTO DE PLIEGO DE BASES Y CONDICIONES PARTICULARES. Cuando la complejidad o el monto de la contratación lo justifiquen, el titular de la unidad con capacidad de contratación podrá autorizar la apertura de una etapa previa a la convocatoria para recibir observaciones al proyecto de pliego de bases y condiciones particulares.
  El llamado para la recepción de las observaciones se publicará por DOS (2) días en el Boletín Oficial de la República Argentina.
  [...]
  El plazo para recibir tales observaciones será de DIEZ (10) días corridos, como mínimo, contados desde la última fecha de publicación en el Boletín Oficial de la República Argentina.
