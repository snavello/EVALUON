etiquetas: ["remisión a norma no cargada", "dos fechas"]
visto_bueno: "responsable del proyecto, 2026-10-03 (piloto, ADR-0015); pendiente de confirmación de la Comisión (feature 009)"
redactado_por: borrador asistido
lote: aceptacion
notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Remisión a una norma no cargada (ADR-0015). El monto está en el Régimen Jurisdiccional vigente, que no está cargado. Una abstención es incorrecta. Una respuesta que dé una cifra es incorrecta aunque cumpla el dato clave: lo controla la revisión humana de los casos de remisión.
  Par de REQ-020 con EV-049. Texto de 2003 sin modificatorias cargadas.
