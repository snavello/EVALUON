id: EV-050
tipo: normativa
documentos: [normativa/disp-afip-297-2003-original.htm]
pregunta: "¿Hasta qué monto se puede usar el trámite simplificado?"
fecha_autorizacion: 2011-03-14
regimen: "Disposición AFIP 297/03"
esperado: |
  El trámite simplificado puede usarse en las contrataciones directas o licitaciones privadas cuando su monto estimado no supere el establecido para este supuesto en el Régimen Jurisdiccional vigente. Las ofertas cuyo monto supere el previsto para este trámite no pueden ser seleccionadas. El Anexo I de la Disposición 297/03 no fija el monto: remite al Régimen Jurisdiccional vigente.
cita:
  - {documento: "Disposición AFIP 297/03, Anexo I", ubicacion: "artículo 22"}
origen: |
  ARTICULO 22. — TRAMITE SIMPLIFICADO. Podrá utilizarse este trámite en las contrataciones directas o licitaciones privadas, cuando su monto estimado no supere el establecido en el Régimen Jurisdiccional vigente, para este supuesto.
  [...]
  Las ofertas cuyo monto supere el previsto para este trámite no podrán ser seleccionadas.
unidades:
