id: EV-010
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "En una orden de compra abierta, ¿cómo se calcula la garantía de mantenimiento de la oferta?"
fecha_autorizacion: 2024-06-17
regimen: "Disposición AFIP 247/2022"
esperado: |
  Aplicando el cinco por ciento (5 %) sobre el importe que resulta de multiplicar el máximo de unidades requeridas en el pliego por el precio unitario cotizado.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 24, inciso b)"}
origen: |
  El monto de la garantía de mantenimiento de la oferta se calculará aplicando el CINCO POR CIENTO (5%) sobre el importe que surja de la multiplicación entre el máximo de las unidades del bien o servicios requeridos en el pliego de bases y condiciones particulares y el precio unitario cotizado.
unidades:
  - {norma: "Disposición AFIP 247/2022", key: anexo/art-24}
datos_clave: ["5 %", "máximo", "unidades", "precio unitario"]
difieren: false
pareja: ""
aviso_modificatorias: false
etiquetas: ["referencia exacta"]
visto_bueno: "provisorio, autorizado por el responsable el 2026-10-03"   # se revisa con la Comisión
redactado_por: borrador asistido
notas: |
  La 297/03 regulaba distinto (garantía de adjudicación del 10 %, ver EV-023).
