id: EV-022
tipo: normativa
documentos: [normativa/disp-afip-297-2003-original.htm]
pregunta: "¿Cómo se integra la Comisión Evaluadora?"
fecha_autorizacion: 2008-11-17
regimen: "Disposición AFIP 297/03"
esperado: |
  Como mínimo por tres (3) miembros titulares: un presidente y dos vocales, que deben ser funcionarios de planta permanente graduados en ciencias económicas, derecho, ingeniería, sistemas o carreras afines, o con acreditada experiencia en la materia. Su funcionamiento lo reglamenta el Administrador Federal.
cita:
  - {documento: "Disposición AFIP 297/03, Anexo I", ubicacion: "artículo 48"}
origen: |
  En cada unidad con capacidad para contratar funcionará una Comisión Evaluadora integrada como mínimo por TRES (3) miembros titulares, UN (1) Presidente y DOS (2) vocales; los mismos deberán ser funcionarios de planta permanente, graduados en ciencias económicas, derecho, ingeniería, sistemas, carreras universitarias afines, o con acreditada experiencia en la materia. El funcionamiento de la Comisión Evaluadora será reglamentado por el Administrador Federal.
unidades:
