notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Pregunta de "¿puede…?": el "sí" lleva la variante "pagarés a la vista", del esperado y del origen. El valor en pesos del módulo no está cargado; la respuesta correcta se queda en M 260. Una respuesta que dé un monto en pesos da contenido no cargado y es incorrecta.
