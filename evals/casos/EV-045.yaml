id: EV-045
tipo: normativa
documentos: [normativa/disp-afip-247-2022-anexo.pdf]
pregunta: "¿Un oferente puede constituir la garantía con un pagaré?"
fecha_autorizacion: 2023-11-13
regimen: "Disposición AFIP 247/2022"
esperado: |
  Sí, con pagarés a la vista suscriptos por quienes tengan el uso de la firma social o actúen con poderes suficientes, siempre que el monto de la garantía no supere la cantidad que representan doscientos sesenta módulos (M 260). Esta forma de garantía no se puede combinar con las demás formas del artículo.
cita:
  - {documento: "Disposición AFIP 247/2022, Anexo (IF-2022-02210546-AFIP-SGDADVCOAD#SDGCTI)", ubicacion: "artículo 65, inciso g)"}
origen: |
  ARTÍCULO 65.- FORMAS DE LA GARANTÍA. Las garantías podrán constituirse de las siguientes formas o combinaciones de ellas:
  [...]
  g) Con pagarés a la vista suscriptos por quienes tengan el uso de la firma social o actuaren con poderes suficientes, cuando el monto de la garantía no supere la cantidad que representan DOSCIENTOS SESENTA MÓDULOS (M 260). Esta forma de garantía no será combinable con las restantes enumeradas en el presente artículo.
