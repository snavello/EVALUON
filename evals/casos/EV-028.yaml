pregunta: "¿Cómo se integra la Comisión Evaluadora?"
fecha_autorizacion: 2024-11-11
regimen: "Disposición AFIP 247/2022"
esperado: "no determinado"
cita: []
origen: |
  Tema de compras que la 247/2022 no resuelve: el artículo 50 del anexo deja la integración "sujetos a la normativa vigente" y solo dice quiénes no pueden integrarla. La normativa que fija la integración no está cargada.
unidades: []
datos_clave: []
difieren: false
pareja: ""
aviso_modificatorias: false
etiquetas: ["tema cercano que la normativa no resuelve"]
visto_bueno: "provisorio, autorizado por el responsable el 2026-10-03"   # se revisa con la Comisión
redactado_por: borrador asistido
notas: |
  Caso dudoso: el artículo 50 sí dice algo (los integrantes no pueden ser funcionarios con competencia para autorizar la convocatoria o aprobar el procedimiento). Una respuesta que cite solo eso podría considerarse parcial y correcta. Si la persona validadora prefiere, se reformula a "¿Cuántos miembros...?". Es la misma pregunta que EV-022 bajo la 297/03.
