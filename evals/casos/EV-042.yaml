  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  La pregunta es general: el dato clave es el plazo general. Los tres años de los inmuebles y el mínimo de seis meses están en el esperado, no en los datos clave.
