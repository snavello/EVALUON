id: EV-035
tipo: normativa
documentos: [normativa/disp-afip-297-2003-original.htm]
pregunta: "¿Cuál es el plazo mínimo para que los interesados formulen observaciones al proyecto de pliego de bases y condiciones particulares?"
fecha_autorizacion: 2023-01-01
regimen: "Disposición AFIP 297/03"
esperado: |
  Cuando la complejidad o el monto de la contratación lo justifiquen, el llamado prevé un plazo previo a la publicación de la convocatoria para que los interesados formulen observaciones al proyecto de pliego. Ese plazo se fija según la complejidad de la contratación y no puede ser inferior a cinco (5) días.
cita:
  - {documento: "Disposición AFIP 297/03, Anexo I", ubicacion: "artículo 27"}
origen: |
  ARTICULO 27. — OBSERVACIONES AL PROYECTO DE PLIEGO. Cuando la complejidad o el monto de la contratación lo justifique, a juicio del responsable de la unidad de contratación, el llamado deberá prever un plazo previo a la publicación de la convocatoria, para que los interesados formulen observaciones al proyecto de pliego de bases y condiciones particulares.
  La convocatoria a formular observaciones al proyecto de pliego se publicará de acuerdo con lo dispuesto por el artículo 29 del presente. El plazo para plantearlas se fijará teniendo en cuenta la complejidad de la contratación y no podrá ser inferior a CINCO (5) días.
