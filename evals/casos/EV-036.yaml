notas: |
  Lote de aceptación (ADR-0014, punto 1; T-061). Redactado el 2026-10-03 solo a partir del texto de la norma, sin correr el sistema ni mirar sus respuestas. No se usa nunca para ajustar: sus datos clave y variantes quedan fijos antes de su primera corrida.
  Par de REQ-020 con EV-037; la 297/03 no tiene el paso de las preferencias. La pregunta dice "empatadas"; la 297/03 habla de "igualdad de ofertas". Las preferencias quedan en lo que establezca la normativa vigente, que no está cargada: una respuesta que diga en qué consisten (por ejemplo, un porcentaje de preferencia) da contenido no cargado y es incorrecta aunque cumpla los datos clave. "mejora de precio" vale también "mejora de precios" (singular y plural).
